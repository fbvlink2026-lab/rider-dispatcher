<!DOCTYPE html>
<html lang="tl-PH">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💬 Serbisyo at Suporta | Admin — Rider Dispatcher</title>
    <!-- File: admin/service.html | Bersyon: 1.3.0 | Petsa: 2026-09-24 | May-akda: martodosko -->
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏍️</text></svg>">
    <style>
        .lista { margin-top: 10px; }
        .bagay { padding: 14px; border-bottom: 1px solid #F2F3F5; }
        .bagay:last-child { border-bottom: none; }
        .antas-mabuti { border-left: 3px solid #00B42A; background: #E8FFEE; padding-left: 10px; }
        .antas-katanungan { border-left: 3px solid #165DFF; background: #E8F0FF; padding-left: 10px; }
        .antas-reklamo { border-left: 3px solid #FF7D00; background: #FFF7E8; padding-left: 10px; }
        .antas-seryoso { border-left: 3px solid #F53F3F; background: #FFECEC; padding-left: 10px; }
        .katayuan-bagong { background: #F53F3F; color: white; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
        .katayuan-sinusuri { background: #FF7D00; color: white; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
        .katayuan-tapos { background: #00B42A; color: white; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
        .mga-pindutan { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
        .btn-maliit { padding: 6px 10px; font-size: 13px; border-radius: 8px; border: none; cursor: pointer; }
        .pagsala { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
        .pagsala select { flex: 1; min-width: 120px; padding: 8px; border-radius: 8px; border: 1px solid #E5E6EB; }
        .patong { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 999; }
        .patong.nakatago { display: none; }
        .patong-loob { background: white; border-radius: 16px; padding: 24px; width: 100%; max-width: 360px; max-height: 90vh; overflow-y: auto; }
        .tugon-lugar { margin-top: 10px; padding: 10px; background: #F9FAFB; border-radius: 8px; font-size: 13px; }
    </style>
</head>
<body>
    <div class="app-container">
        <nav class="nav-bar">
            <a href="index.html" class="nav-back">← Bumalik</a>
            <span class="nav-title">💬 Serbisyo at Suporta</span>
            <span></span>
        </nav>

        <!-- KABUUAN -->
        <div style="background: linear-gradient(135deg, #165DFF 0%, #4080FF 100%); color: white; padding: 16px; border-radius: 12px; margin: 16px 0;">
            <h3 style="margin:0 0 10px;">📊 Kabuuan ng Ulat</h3>
            <div class="grid-2">
                <div>
                    <p style="font-size:13px; opacity:0.8; margin:0;">Kabuuang Isinumite</p>
                    <p style="font-size:20px; font-weight:700; margin:2px 0;" id="kabuuang_ulat">0</p>
                </div>
                <div>
                    <p style="font-size:13px; opacity:0.8; margin:0;">Hindi Nasagot</p>
                    <p style="font-size:20px; font-weight:700; margin:2px 0;" id="hindi_nasagot">0</p>
                </div>
            </div>
        </div>

        <!-- PAGSALA -->
        <section class="form-section">
            <div class="pagsala">
                <select id="sala_antas">
                    <option value="">Lahat ng Antas</option>
                    <option value="mabuti">💚 Mabuti / Papuri</option>
                    <option value="katanungan">💙 Katanungan</option>
                    <option value="reklamo">🧡 Reklamo</option>
                    <option value="seryoso">❤️ Seryoso / Agarang Kailangan</option>
                </select>
                <select id="sala_katayuan">
                    <option value="">Lahat ng Katayuan</option>
                    <option value="bago">🆕 Bagong Isinumite</option>
                    <option value="sinusuri">⏳ Sinusuri</option>
                    <option value="tapos">✅ Tapos</option>
                </select>
            </div>
        </section>

        <!-- LISTAHAN NG ULAT -->
        <section class="form-section">
            <h3>📋 Listahan ng Mga Ulat</h3>
            <div id="lista_ulat" class="lista">
                <p style="text-align:center; color:#4E5969; padding:20px;">Naglalagay…</p>
            </div>
        </section>

        <!-- MAGDAGDAG NG ULAT -->
        <section class="form-section">
            <h3 id="pamagat-anyo">➕ Magdagdag ng Ulat / Tala</h3>
            
            <div class="input-group">
                <label>Mamimili o Nagpadala</label>
                <select id="ul_mamimili">
                    <option value="">— Hindi nakilala / Iba —</option>
                </select>
            </div>
            <div class="input-group">
                <label>Uri ng Ulat</label>
                <select id="ul_antas">
                    <option value="mabuti">💚 Mabuti / Papuri</option>
                    <option value="katanungan">💙 Katanungan</option>
                    <option value="reklamo">🧡 Reklamo</option>
                    <option value="seryoso">❤️ Seryoso / Agarang Kailangan</option>
                </select>
            </div>
            <div class="input-group">
                <label>May Kaugnay na Utos</label>
                <select id="ul_utos">
                    <option value="">— Walang kaugnay na utos —</option>
                </select>
            </div>
            <div class="input-group">
                <label>Paksa / Pamagat</label>
                <input type="text" id="ul_paksa" placeholder="Maikling paglalarawan">
            </div>
            <div class="input-group">
                <label>Buong Detalye</label>
                <textarea id="ul_detalyadong" style="width:100%; min-height:100px; padding:10px; border:1px solid #E5E6EB; border-radius:8px;" placeholder="Ilarawan nang buo ang nangyari…"></textarea>
            </div>
            <button id="isumbag-btn" class="btn primary-btn btn-full">✅ Isumite ang Ulat</button>
        </section>

        <!-- PATONG: PAGTUGON AT PAGBASA -->
        <div id="patong_tugon" class="patong nakatago">
            <div class="patong-loob">
                <h2 id="paksa_tugon"></h2>
                <div id="nilalaman_tugon" style="margin:10px 0; font-size:14px; line-height:1.5;"></div>
                <div id="lugar_tugon" class="tugon-lugar" style="display:none;">
                    <strong>Tugon:</strong>
                    <p id="teksto_tugon"></p>
                    <p style="font-size:12px; color:#86909C;" id="oras_tugon"></p>
                </div>
                <div class="input-group" style="margin-top:12px;">
                    <label>Maglagay ng Tugon</label>
                    <textarea id="bagong_tugon" style="width:100%; min-height:70px; padding:10px; border:1px solid #E5E6EB; border-radius:8px;"></textarea>
                </div>
                <div class="input-group">
                    <label>Katayuan Matapos Tumugon</label>
                    <select id="katayuan_tapos">
                        <option value="sinusuri">Sinusuri pa rin</option>
                        <option value="tapos" selected>Tapos na</option>
                    </select>
                </div>
                <button id="tanggapin_tugon" class="btn primary-btn btn-full">✅ I-send ang Tugon</button>
                <button id="isara_tugon" class="btn secondary-btn btn-full" style="margin-top:8px;">Isara</button>
            </div>
        </div>
    </div>

    <script src="../js/common.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let idTinitingnan = null;

            // Ilagay ang mga pagpipilian
            function ilagayMgaPagpipilian() {
                // Mamimili
                const selMamimili = document.getElementById('ul_mamimili');
                selMamimili.innerHTML = '<option value="">— Hindi nakilala / Iba —</option>';
                (RIDER_APP.datos.mga_mamimili || []).forEach(m => {
                    selMamimili.innerHTML += `<option value="${m.id}">${m.pangalan} — ${m.telepono}</option>`;
                });
                // Utos
                const selUtos = document.getElementById('ul_utos');
                selUtos.innerHTML = '<option value="">— Walang kaugnay na utos —</option>';
                (RIDER_APP.datos.mga_utos || []).filter(u => u.katayuan === 'tapos').sort((a,b) => new Date(b.petsa||0) - new Date(a.petsa||0)).forEach(u => {
                    const pangalanMamimili = (RIDER_APP.datos.mga_mamimili || []).find(m => m.id === u.mamimiliId)?.pangalan || 'Hindi kilala';
                    const rutaPangalan = (RIDER_APP.datos.mga_ruta || []).find(r => r.id === u.rutaId)?.pangalan || 'Hindi tinukoy';
                    selUtos.innerHTML += `<option value="${u.id}">${pangalanMamimili} — ${rutaPangalan} (${u.petsa?.substring(0,10)})</option>`;
                });
            }

            // Kunin ang pangalan mula sa ID
            function kuninPangalanMamimili(id) {
                if (!id) return 'Hindi nakilala';
                const m = (RIDER_APP.datos.mga_mamimili || []).find(x => x.id === id);
                return m ? m.pangalan : 'Hindi kilala';
            }

            // Ipakita ang listahan
            function ilistaUlat() {
                if (!RIDER_APP.datos.mga_ulat) RIDER_APP.datos.mga_ulat = [];
                let lahat = RIDER_APP.datos.mga_ulat;

                // Pagsala
                const salaAntas = document.getElementById('sala_antas').value;
                const salaKatayuan = document.getElementById('sala_katayuan').value;
                if (salaAntas) lahat = lahat.filter(u => u.antas === salaAntas);
                if (salaKatayuan) lahat = lahat.filter(u => u.katayuan === salaKatayuan);

                // Ayusin mula sa pinakabago
                lahat = [...lahat].sort((a, b) => new Date(b.petsa) - new Date(a.petsa));

                // Kabuuan
                const kabuuan = RIDER_APP.datos.mga_ulat.length;
                const hindiNasagot = RIDER_APP.datos.mga_ulat.filter(u => !u.tugon).length;
                document.getElementById('kabuuang_ulat').textContent = kabuuan;
                document.getElementById('hindi_nasagot').textContent = hindiNasagot;

                const lugar = document.getElementById('lista_ulat');
                if (lahat.length === 0) {
                    lugar.innerHTML = '<p style="text-align:center; color:#86909C; padding:20px;">Wala pang naitalang ulat.</p>';
                    return;
                }

                const klaseAntas = {
                    mabuti: 'antas-mabuti',
                    katanungan: 'antas-katanungan',
                    reklamo: 'antas-reklamo',
                    seryoso: 'antas-seryoso'
                };
                const tekstoAntas = {
                    mabuti: '💚 Mabuti',
                    katanungan: '💙 Katanungan',
                    reklamo: '🧡 Reklamo',
                    seryoso: '❤️ Seryoso'
                };
                const klaseKatayuan = {
                    bago: 'katayuan-bagong',
                    sinusuri: 'katayuan-sinusuri',
                    tapos: 'katayuan-tapos'
                };
                const tekstoKatayuan = {
                    bago: '🆕 Bagong',
                    sinusuri: '⏳ Sinusuri',
                    tapos: '✅ Tapos'
                };

                lugar.innerHTML = '';
                lahat.forEach(u => {
                    lugar.innerHTML += `
                    <div class="bagay ${klaseAntas[u.antas]}" data-id="${u.id}">
                        <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                            <div>
                                <strong>${u.paksa}</strong>
                                <span style="margin-left:6px;" class="${klaseKatayuan[u.katayuan]}">${tekstoKatayuan[u.katayuan]}</span><br>
                                ${tekstoAntas[u.antas]} — ${kuninPangalanMamimili(u.mamimiliId)}<br>
                                <small style="color:#86909C;">${u.petsa.replace('T',' ')}</small>
                            </div>
                        </div>
                        <div class="mga-pindutan">
                            <button class="btn-maliit secondary-btn buksan-btn" data-id="${u.id}">👁️ Tingnan at Tugunan</button>
                        </div>
                    </div>`;
                });

                ilakipGawainSaPindutan();
            }

            function ilakipGawainSaPindutan() {
                document.querySelectorAll('.buksan-btn').forEach(btn => {
                    btn.addEventListener('click', () => buksanTugon(btn.dataset.id));
                });
            }

            // Buksan ang patong para tumugon
            function buksanTugon(id) {
                idTinitingnan = id;
                const ulat = RIDER_APP.datos.mga_ulat.find(u => u.id === id);
                if (!ulat) return;

                document.getElementById('paksa_tugon').textContent = ulat.paksa;
                document.getElementById('nilalaman_tugon').innerHTML = `
                    <p><strong>Nagpadala:</strong> ${kuninPangalanMamimili(ulat.mamimiliId)}</p>
                    <p><strong>Uri:</strong> ${ulat.antas}</p>
                    <p><strong>Petsa:</strong> ${ulat.petsa.replace('T',' ')}</p>
                    <p><strong>Detalye:</strong><br>${ulat.detalyadong}</p>
                `;

                if (ulat.tugon) {
                    document.getElementById('lugar_tugon').style.display = 'block';
                    document.getElementById('teksto_tugon').textContent = ulat.tugon;
                    document.getElementById('oras_tugon').textContent = 'Tumugon noong: ' + (ulat.oras_tugon || 'Hindi nakatala');
                } else {
                    document.getElementById('lugar_tugon').style.display = 'none';
                }

                document.getElementById('bagong_tugon').value = '';
                document.getElementById('patong_tugon').classList.remove('nakatago');
            }

            document.getElementById('isara_tugon').addEventListener('click', () => {
                document.getElementById('patong_tugon').classList.add('nakatago');
                idTinitingnan = null;
            });

            document.getElementById('tanggapin_tugon').addEventListener('click', () => {
                if (!idTinitingnan) return;
                const tugon = document.getElementById('bagong_tugon').value.trim();
                if (!tugon) { alert('❌ Ipasok ang tugon'); return; }

                const idx = RIDER_APP.datos.mga_ulat.findIndex(u => u.id === idTinitingnan);
                RIDER_APP.datos.mga_ulat[idx].tugon = tugon;
                RIDER_APP.datos.mga_ulat[idx].oras_tugon = new Date().toISOString().replace('T',' ');
                RIDER_APP.datos.mga_ulat[idx].katayuan = document.getElementById('katayuan_tapos').value;
                RIDER_APP.iimbak();
                alert('✅ Naitala na ang tugon!');
                document.getElementById('patong_tugon').classList.add('nakatago');
                ilistaUlat();
            });

            // Isumite ang bagong ulat
            document.getElementById('isumbag-btn').addEventListener('click', () => {
                const paksa = document.getElementById('ul_paksa').value.trim();
                const detalyadong = document.getElementById('ul_detalyadong').value.trim();
                if (!paksa || !detalyadong) { alert('❌ Punan ang paksa at detalye'); return; }

                const bagongUlat = {
                    id: 'ulat_' + Date.now(),
                    mamimiliId: document.getElementById('ul_mamimili').value || null,
                    antas: document.getElementById('ul_antas').value,
                    kaugnay_utosId: document.getElementById('ul_utos').value || null,
                    paksa,
                    detalyadong,
                    katayuan: 'bago',
                    petsa: new Date().toISOString()
                };

                if (!RIDER_APP.datos.mga_ulat) RIDER_APP.datos.mga_ulat = [];
                RIDER_APP.datos.mga_ulat.push(bagongUlat);
                RIDER_APP.iimbak();
                alert('✅ Naisumite na ang ulat!');
                
                // Linisin ang anyo
                document.getElementById('ul_paksa').value = '';
                document.getElementById('ul_detalyadong').value = '';
                ilistaUlat();
            });

            // Pagsala
            ['sala_antas', 'sala_katayuan'].forEach(id => {
                document.getElementById(id).addEventListener('change', ilistaUlat);
            });

            ilagayMgaPagpipilian();
            ilistaUlat();
        });
    </script>
</body>
</html>
